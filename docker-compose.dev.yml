# Development: Postgres and Redis only. Apps run on the host with `pnpm dev`.
services:
    postgres:
        image: postgres:16-alpine
        container_name: app_db_dev
        restart: unless-stopped
        environment:
            POSTGRES_DB: ${DB_NAME:-app}
            POSTGRES_USER: ${DB_USER:-app}
            POSTGRES_PASSWORD: ${DB_PASSWORD:-change-me}
        ports:
            - "${DB_PORT:-5432}:5432"
        volumes:
            - pgdata_dev:/var/lib/postgresql/data

    # noeviction: BullMQ keeps its jobs in Redis, and an evicted key is a silently lost job.
    redis:
        image: redis:8-alpine
        container_name: app_redis_dev
        restart: unless-stopped
        command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
        ports:
            - "${REDIS_PORT:-6379}:6379"
        volumes:
            - redisdata_dev:/data

volumes:
    pgdata_dev:
    redisdata_dev:
